name: Weekly PolicyRec Data Collection

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  collect-and-normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw data
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
        run: |
          python scripts/fetch.py \
            --sources biz kst youth \
            --page 1 \
            --page-size 200 \
            --force

      - name: Run normalization pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          pip install jupyter nbconvert
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            notebooks/PolicyRec_v1_1_6.ipynb

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/csv/raw/ data/csv/main/
          git diff --cached --quiet || git commit -m "chore: weekly data update $(date +'%Y-%m-%d')"
          git push
