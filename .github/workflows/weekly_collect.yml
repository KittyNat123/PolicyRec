name: Weekly PolicyRec Data Collection

on:
  schedule:
    - cron: '0 21 * * 0'
  workflow_dispatch:

jobs:
  collect-and-normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch raw data
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          KSTARTUP_API_KEY: ${{ secrets.KSTARTUP_API_KEY }}
          YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
        run: |
          python scripts/fetch.py \
            --sources biz kst youth \
            --page 1 \
            --page-size 200 \
            --force \
            --normalize

      - name: Copy combined csv to pipeline input
        run: |
          mkdir -p data/csv/raw
          cp data/clean/combined.csv data/csv/raw/raw_v1_1_6.csv

      - name: Rename raw files to auto prefix
        run: |
          for f in data/raw/biz/*.json data/raw/kst/*.json data/raw/youth/*.json; do
            [ -f "$f" ] && mv "$f" "$(dirname $f)/auto_$(basename $f)"
          done

      - name: Run normalization pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          pip install jupyter nbconvert
          jupyter nbconvert \
            --to notebook \
            --execute \
            --inplace \
            PolicyRec_v1_1_6.ipynb

      - name: Copy output csv to auto prefix files
        run: |
          if [ -f data/csv/main/main_v1_1_6.csv ]; then
            cp data/csv/main/main_v1_1_6.csv data/csv/main/auto_main_v1_1_6.csv
            cp data/csv/main/main_v1_1_6.csv data/csv/main/auto_main_v1_1_6_$(date +'%Y%m%d').csv
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: weekly data update $(date +'%Y-%m-%d')"
          git push
